name: Deploy to GitHub Pages and Schedule Ingestion

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Verificación de Servicios (Luz, Agua, Gas) y Expensas (días 1 a 5): Diariamente a las 06:00, 12:00, 18:00 y 21:00 Arg (UTC-3).
    # En UTC: 00:00, 09:00, 15:00 y 21:00 hs.
    - cron: '0 0,9,15,21 * * *'

concurrency:
  group: sarmiento-151-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Clonar historial para commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber urllib3

      - name: Determine Update Mode
        id: mode-selector
        run: |
          # Si se activa por push, dispatch o por schedule durante los primeros 5 días del mes (días 1-5)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%d)" -le 5 ]; }; then
            echo "MODE=--all" >> $GITHUB_ENV
            echo "Determined Update Mode: --all (Full update + PDF search)"
          else
            echo "MODE=--services-only" >> $GITHUB_ENV
            echo "Determined Update Mode: --services-only (Utility monitoring only)"
          fi

      - name: Run Update Script
        run: |
          python cron_update.py ${{ env.MODE }}

      - name: Commit Database and Status Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gastos.json prorrateo.json servicios_status.json liquidaciones/
          # Hacer commit solo si hay cambios en staging para evitar fallar el job
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-update): sync database and status data [skip ci]"
            for attempt in 1 2 3; do
              if git push origin main; then
                echo "Push exitoso en intento $attempt."
                break
              else
                echo "Conflicto de concurrencia al empujar a main. Sincronizando con rebase..."
                git fetch origin main
                git rebase -X theirs origin/main || {
                  git checkout --ours gastos.json prorrateo.json servicios_status.json 2>/dev/null || true
                  git add gastos.json prorrateo.json servicios_status.json liquidaciones/
                  git -c core.editor=true rebase --continue || git rebase --abort
                }
              fi
            done
          else
            echo "No changes in utility status or PDF database."
          fi

      # Deploy: Vercel auto-despliega desde la rama main al detectar el push.
      # Configuración del dominio en: vercel.com → sarmiento-151 → Settings → Domains
      # Dominio personalizado: alexismartyniuk.com.ar con prefijo de ruta /sarmiento-151
